[project]
name = "coldchain"
version = "0.1.0"
description = "Excursion-aware cold-chain data store (IoTBDM course project)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "faker>=24",
    "psycopg[binary,pool]>=3.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "typer>=0.12",
    "pydantic>=2.6",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
kafka = ["kafka-python-ng>=2.2"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
coldchain = "coldchain.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coldchain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
